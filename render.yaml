# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: qadam-history
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/overview
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
    # Тегін жоспарда тұрақты диск жоқ: аккаунттар мен нәтижелер сервер қайта қосылғанда өшеді.
    # Деректерді сақтау үшін plan: starter қойып, мына бөлікті қосыңыз:
    #   - key: DATA_DIR (envVars ішіне)
    #     value: /var/data
    # disk:
    #   name: qadam-data
    #   mountPath: /var/data
    #   sizeGB: 1
